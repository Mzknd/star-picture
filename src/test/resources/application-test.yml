spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:starpicture;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  session:
    store-type: none
knife4j:
  enable: false
logging:
  level:
    root: WARN
